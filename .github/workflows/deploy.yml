name: Fetch Data & Deploy to GitHub Pages

on:
  schedule:
    - cron: '0 1 * * *'   # 01:00 UTC every night (6:30 AM IST)
  workflow_dispatch:        # allow manual trigger from GitHub UI

permissions:
  contents: write           # needed to push to gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout source ──────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python setup ─────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install requests

      # ── 3. Fetch GitHub issues + project status ─────────────
      - name: Fetch issues data
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scripts/fetch_data.py

      # ── 4. Build site: copy src → dist, inject secrets ──────
      - name: Build site
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        run: |
          mkdir -p dist/data

          # Copy static assets
          cp -r src/* dist/

          # Copy the freshly fetched data
          cp data/issues.json dist/data/issues.json

          # Inject the OpenRouter key into ai.js
          # The placeholder __OPENROUTER_KEY__ is replaced with the real key.
          # The key only ever exists in the deployed gh-pages branch, NOT in source.
          sed -i "s|__OPENROUTER_KEY__|${OPENROUTER_KEY}|g" dist/ai.js

          echo "Build complete. Files in dist/:"
          ls -lh dist/
          echo "Data file size: $(wc -c < dist/data/issues.json) bytes"

      # ── 5. Deploy dist/ to gh-pages branch ──────────────────
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: 'chore: nightly data refresh ${{ github.run_number }}'
          force_orphan: false    # keep history so diffs are readable
