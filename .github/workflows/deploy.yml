name: Fetch Data & Deploy to GitHub Pages

on:
  schedule:
    - cron: '0 1 * * *'   # 01:00 UTC every night (6:30 AM IST)
  workflow_dispatch:        # allow manual trigger from GitHub UI

permissions:
  contents: write           # needed to push to gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout source ──────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python setup ─────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install requests

      # ── 3. Restore previous cache from gh-pages ────────────
      - name: Restore previous issues.json (for delta sync)
        run: |
          mkdir -p data
          curl -sf "https://varun-heman.github.io/dristi-dashboard/data/issues.json" \
            -o data/issues.json && echo "  Cache restored." || echo "  No cache found — will do full fetch."

      # ── 4. Fetch only new/updated issues ────────────────────
      - name: Fetch issues data
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scripts/fetch_data.py

      # ── 4. Generate AI analysis (key stays in GitHub Secrets) ──
      - name: Generate AI analysis
        continue-on-error: true   # never block deploy if AI step fails
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        run: python scripts/generate_analysis.py

      # ── 5. Build site: copy src → dist ──────────────────────
      - name: Build site
        run: |
          mkdir -p dist/data

          # Copy static assets
          cp -r src/* dist/

          # Copy fetched data + AI analysis
          cp data/issues.json dist/data/issues.json
          cp data/analysis.json dist/data/analysis.json

          echo "Build complete. Files in dist/:"
          ls -lh dist/
          echo "Data file size: $(wc -c < dist/data/issues.json) bytes"

      # ── 5. Deploy dist/ to gh-pages branch ──────────────────
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: 'chore: nightly data refresh ${{ github.run_number }}'
          force_orphan: false    # keep history so diffs are readable
